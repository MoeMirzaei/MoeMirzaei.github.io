name: Update data from ORCID and GitHub

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC: refresh ORCID + GitHub data
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

# The site itself is published by GitHub Pages from the main branch.
# This workflow only refreshes data/*.json and commits it; that commit triggers the Pages build.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ORCID and GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py || echo "::warning::A data source failed; keeping the last saved data."

      - name: Save new data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update data from ORCID/GitHub" && git push)
